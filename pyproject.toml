[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-guide-mvp"
version = "0.1.0"
description = "跨交通联程可执行攻略生成器 MVP"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.0.0,<9.0.0"
]

[tool.setuptools]
packages = ["app", "app.services", "app.connectors"]

[tool.setuptools.package-data]
app = ["static/*"]
